name: Terraform Apply

on:
  push:
    branches:
      - main  # Change to your default branch if different

jobs:
  terraform:
    name: 'Terraform Apply to AWS'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .   # change if your .tf files are in a subfolder like infra/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6  # Use the version you need

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1  # Change this to your desired region

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

      # ✅ Always runs last, even if earlier steps fail
      - name: Final Status Message
        if: always()  # ensures this step runs even if previous steps fail
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Terraform CI/CD completed successfully!"
          else
            echo "❌ Terraform CI/CD failed! Check the logs above for errors."
          fi
